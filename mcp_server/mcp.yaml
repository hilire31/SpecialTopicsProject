name: enterprise-chatbot-mcp
version: 1.0.0
description: Model Context Protocol for the Enterprise Chatbot. Exposes context providers and actions so models can query the system for employee-aware documents and generate responses.
servers:
  - url: http://localhost:8080
    description: Local MCP server

context_providers:
  - id: employee_profile
    description: Provides the employee profile used for permission filtering
    type: object
    schema:
      type: object
      properties:
        user_id: {type: string}
        name: {type: string}
        email: {type: string}
        department: {type: string}
        permission_level: {type: string}

  - id: conversation_history
    description: Conversation messages to provide conversational context
    type: array
    items:
      type: object
      properties:
        role: {type: string}
        content: {type: string}

  - id: documents
    description: Documents retrieved by Elasticsearch, filtered by the employee's permissions
    type: array
    items:
      type: object
      properties:
        doc_id: {type: string}
        title: {type: string}
        content: {type: string}
        department: {type: string}
        document_type: {type: string}
        permission: {type: object}

actions:
  - id: retrieve_documents
    description: Retrieve documents based on a query and employee context
    inputs:
      - name: query
        type: string
      - name: employee
        type: object
      - name: top_k
        type: integer
    outputs:
      - name: documents
        type: array
  - id: generate_response
    description: Generate a response from the LLM given documents and conversation history
    inputs:
      - name: query
        type: string
      - name: employee
        type: object
      - name: documents
        type: array
      - name: conversation_history
        type: array
    outputs:
      - name: response
        type: string
  - id: chat
    description: Composite: retrieve_documents then generate_response
    inputs:
      - name: query
        type: string
      - name: employee
        type: object
      - name: conversation_history
        type: array
    outputs:
      - name: response
        type: string
  
  - id: create_user
    description: Create a new user in the system (requires manager level or higher)
    inputs:
      - name: name
        type: string
        description: Full name of the user
      - name: email
        type: string
        description: Email address of the user
      - name: department
        type: string
        description: Department of the user
      - name: permission_level
        type: string
        description: Permission level (employee, manager, director, executive)
      - name: employee
        type: object
        description: Employee making the request (for permission check)
    outputs:
      - name: success
        type: boolean
      - name: user
        type: object
      - name: message
        type: string
  
  - id: create_document
    description: Create a new document in the system
    inputs:
      - name: title
        type: string
        description: Document title
      - name: content
        type: string
        description: Document content
      - name: department
        type: string
        optional: true
        description: Department associated with the document
      - name: document_type
        type: string
        optional: true
        description: Type of document (policy, manual, report, etc.)
      - name: permission_min_level
        type: string
        description: Minimum permission level required (employee, manager, director, executive)
      - name: allowed_departments
        type: array
        optional: true
        description: List of departments with access (null means all departments)
      - name: employee
        type: object
        description: Employee making the request
    outputs:
      - name: success
        type: boolean
      - name: doc_id
        type: string
      - name: document
        type: object
      - name: message
        type: string

endpoints:
  - path: /mcp/spec
    method: GET
    description: Returns the MCP spec
  - path: /mcp/actions/retrieve_documents
    method: POST
    description: Execute the retrieve_documents action
  - path: /mcp/actions/generate_response
    method: POST
    description: Execute the generate_response action
  - path: /mcp/actions/chat
    method: POST
    description: Execute the chat action
  - path: /mcp/actions/create_user
    method: POST
    description: Execute the create_user action
  - path: /mcp/actions/create_document
    method: POST
    description: Execute the create_document action
